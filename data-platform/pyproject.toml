[project]
name = "local-agent-platform"
version = "0.1.0"
description = "Local-first AI-agent data platform (spoke node): Meltano EL -> DuckLake -> SQLMesh -> SQLite/sqlite-vec+FTS5 serving index."
readme = "README.md"
# Python floor traced to §4 ground truth (see README "Version floors" table):
#   meltano    4.2.1   requires_python >=3.10
#   duckdb     1.5.4   requires_python >=3.10.0
#   singer-sdk 0.54.5  requires_python >=3.10
#   sqlmesh    0.236.0 requires_python >=3.9
# max(...) => >=3.10
requires-python = ">=3.10"
dependencies = [
    # EL orchestration. PyPI meltano 4.2.1, requires_python >=3.10.
    "meltano>=4.2.1,<5",
    # Transform. PyPI sqlmesh 0.236.0, requires_python >=3.9.
    "sqlmesh>=0.236.0,<0.237",
    # Lakehouse engine. DuckLake v1.0 requires DuckDB v1.5.2+ (ducklake.select).
    "duckdb>=1.5.2,<2",
    # Serving: vector search inside the single SQLite file.
    "sqlite-vec>=0.1.9,<0.2",
    # The custom Meltano extractor is built on the Meltano Singer SDK.
    "singer-sdk>=0.54.5,<0.55",
    # .env loading for the control-plane/data-plane split.
    "python-dotenv>=1.0.1",
    "hwpkit>=1.0.0,<2",
    # PDF text extraction on the BUILD path. Pure python (no compiled extension),
    # BSD-3-Clause, Production/Stable. Chosen over pymupdf, which is AGPL and
    # compiled -- acceptable for the operator-only `ocr` extra below, not for a
    # default dependency of an MIT project. Chosen over pdfminer.six because a
    # born-digital bill needs the text layer, not layout analysis.
    "pypdf>=6,<7",
]

[project.optional-dependencies]
# Optional Office 97-2003 BINARY formats (.doc/.xls/.ppt) for pipeline/extract.py.
# NOT installed by default: no document in the corpus uses them, and this is the
# one format group with no maintained pure-python reader -- the text sits behind
# a piece table in an OLE compound file. office-oxide (MIT OR Apache-2.0, pure
# Rust, no native deps) is young (first release 2026-04, still 0.x), so it is
# scoped to exactly the formats that have no alternative: .docx/.xlsx/.pptx are
# read with the standard library instead, and a misparse here is caught by
# `_validate` rather than indexed. Enable with: uv sync --extra legacy
# Encrypted Word 97 (RC4) is NOT decrypted by it; convert such a file first.
legacy = [
    "office-oxide>=0.1.8,<0.2",
]
# Optional context-preserving embedder: an int8-quantized ONNX sentence encoder
# run torch-free on CPU via onnxruntime. NOT installed by default -- the default
# `hashing` provider needs none of this. Enable with: uv sync --extra onnx-embed
# then set EMBEDDING_PROVIDER=onnx_int8 (see .env.example). The model is fetched
# once and cached; inference is local, so the read path stays offline.
onnx-embed = [
    "onnxruntime>=1.17,<2",
    "tokenizers>=0.20,<1",
    "huggingface-hub>=0.24,<1",
    "numpy>=1.24",
]
# Optional OFFLINE OCR for scanned PDFs (tools/ocr/ocr_prepare.py). NOT installed
# by default and NEVER imported by `make build` -- OCR is an operator step that
# lands reviewed .txt in the inbox, so the build stays model-free. Both engines
# (PP-OCRv5 Korean, PaddleOCR-VL) are Apache-2.0. Enable with: uv sync --extra ocr
ocr = [
    "paddleocr>=3,<4",
    "paddlepaddle>=3,<4",
    "pymupdf>=1.24",
]
# Optional web fetching for sources with NO official API (pipeline/fetch_web.py).
# NOT installed by default and NEVER imported by `make build` -- fetching is an
# operator step that lands files in the inbox. Uses scrapling's Fetcher /
# DynamicFetcher / StealthyFetcher, escalating to a stealth browser only when a
# public page bot-blocks a plain fetch (§ invariant 8). The stdlib path covers
# ordinary files; scrapling is needed for --render and --stealth. The [fetchers]
# extra pulls the pieces --stealth actually needs (curl_cffi impersonation,
# camoufox, patchright, msgspec) -- a bare `scrapling` import succeeds but
# StealthyFetcher then dies on a missing module. Bare-metal browsers are NOT a pip
# artifact: after `uv sync --extra web` you must still run `uv run scrapling install`
# (and/or `uv run patchright install chromium`) once to download them.
web = [
    "scrapling[fetchers]>=0.2",
]
# Optional Korean morphological augmentation for the KEYWORD arm (KIWI_MORPH=1).
# NOT installed by default and NEVER needed by the model-free default path. It
# APPENDS NNG/NNP/XR noun lemmas beside the char-bigram backbone on BOTH the write
# (expand_cjk) and query (build_fts_query) sides -- additive, never replacing the
# bigrams -- so a josa-glued query (사업자의) also matches the bare-noun answer
# (사업자). Offline (model ships as a wheel), deterministic Viterbi. Recorded in
# index_signature so a Kiwi index is never queried Kiwi-off. Enable with:
# uv sync --extra kiwi  then set KIWI_MORPH=1 and rebuild.
kiwi = [
    "kiwipiepy>=0.18",
    "kiwipiepy-model>=0.21",
]

[project.scripts]
# Executables Meltano invokes (meltano.yml -> executable:).
tap-inbox-documents = "pipeline.tap_inbox_documents:TapInboxDocuments.cli"
target-ducklake-local = "pipeline.target_ducklake:TargetDuckLake.cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "agent"]
